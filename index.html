<!DOCTYPE html> 
<html> 
<head> 
    <title>Moving Circle</title> 
    <style> 
        .ball{ 
            width:50px; 
            height:50px; 
            position:absolute; 
            background-color: rgb(49, 21, 173); 
            border-radius:50px; 
            top: 70px;
        } 
        .ball2{ 
            width:50px; 
            height:50px; 
            position:absolute; 
            background-color: rgb(216, 40, 69); 
            border-radius:50px; 
        } 
 
    </style> 
</head> 
<body> 
 
    <div class="ball" id="ball"></div>
    <div class="ball2" id="ball2"></div>
    <script src="movingBall.js"></script>

</body> 

</html>
